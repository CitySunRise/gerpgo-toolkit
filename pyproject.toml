[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gerpgo-cli"
version = "0.2.0"
description = "Cross-platform CLI and SDK for approved Gerpgo ERP interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CitySunRise" }]
keywords = ["gerpgo", "erp", "cli", "codex-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "filelock>=3.15,<4",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "pycryptodome>=3.20,<4",
  "requests>=2.31,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "PyYAML>=6,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-requests>=2.31,<3",
]

[project.scripts]
gerpgo-cli = "gerpgo_cli.main:app"

[project.urls]
Homepage = "https://github.com/CitySunRise/gerpgo-toolkit"
Repository = "https://github.com/CitySunRise/gerpgo-toolkit"
Issues = "https://github.com/CitySunRise/gerpgo-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gerpgo_sdk", "src/gerpgo_cli"]

[tool.hatch.build.targets.wheel.force-include]
"skills/gerpgo-erp" = "gerpgo_cli/resources/gerpgo-erp"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/skills",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gerpgo_sdk", "gerpgo_cli"]
